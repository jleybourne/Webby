name: Webby
options:
  bundleIdPrefix: au.leybourne
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Webby:
    type: application
    platform: tvOS
    sources:
      - path: Webby
    settings:
      base:
        PRODUCT_NAME: Webby
        PRODUCT_BUNDLE_IDENTIFIER: au.leybourne.webby
        INFOPLIST_FILE: Webby/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Webby/Engine/Webby-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 57PZQ6DM94
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Webby:
    build:
      targets:
        Webby: all
    run:
      config: Debug
    archive:
      config: Release
